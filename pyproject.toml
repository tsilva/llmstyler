[project]
name = "llmstyler"
version = "0.1.0"
description = "Config-driven speaking-style dataset generation and model publishing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.14.3",
  "datasets>=3.0.0",
  "huggingface_hub>=1.27.0",
  "idna>=3.15",
  "omegaconf>=2.3.1",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9.0,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.1",
]

[project.scripts]
llmstyler = "llmstyler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmstyler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
